<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 8px;
      }
      p {
        color: #475569;
        line-height: 1.5;
      }
      button {
        margin-top: 20px;
        min-height: 48px;
        padding: 0 24px;
        border-radius: 12px;
        border: none;
        background: #1d4ed8;
        color: white;
        font-weight: 600;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        This page needs an internet connection. Starting or ending a shift, submitting inspection photos, and
        anything else that saves data will not work until you're back online.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
